---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plugin-barman-cloud
  namespace: database
spec:
  interval: 15m
  chart:
    spec:
      chart: plugin-barman-cloud
      version: 0.7.1
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: flux-system
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    crds:
      create: true
