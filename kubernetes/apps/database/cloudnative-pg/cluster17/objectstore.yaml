---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: postgres17-backup
  namespace: database
spec:
  retentionPolicy: "30d"
  instanceSidecarConfiguration:
    env:
      # s3.skym.fi doesn't support the SigV4 streaming checksum trailers
      # newer botocore defaults to, which it responds to with a malformed
      # (unparsable) HTTP response.
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
  configuration:
    destinationPath: s3://oracle-cnpg/
    endpointURL: http://s3.skym.fi
    s3Credentials:
      accessKeyId:
        name: cloudnative-pg-secret
        key: aws-access-key-id
      secretAccessKey:
        name: cloudnative-pg-secret
        key: aws-secret-access-key
    wal:
      compression: bzip2
      maxParallel: 4
    data:
      compression: bzip2
