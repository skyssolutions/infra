---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg-plugin-barman-cloud
  namespace: flux-system
spec:
  dependsOn:
    - name: database-cloudnative-pg
  path: ./kubernetes/apps/database/cloudnative-pg/plugin-barman-cloud/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: barman-cloud
      namespace: database
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 3m
