---
# The envoy Service has public externalIPs, so every listener port is exposed.
# Port 8443 trusts PROXY protocol headers, so only towonel-agent may reach it.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: envoy-tunnel-listener
spec:
  endpointSelector:
    matchLabels:
      gateway.envoyproxy.io/owning-gateway-name: envoy
  enableDefaultDeny:
    ingress: false
  ingressDeny:
    - fromEntities:
        - world
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
    - fromEndpoints:
        - matchExpressions:
            - key: io.kubernetes.pod.namespace
              operator: Exists
            - key: app.kubernetes.io/name
              operator: NotIn
              values:
                - towonel-agent
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
